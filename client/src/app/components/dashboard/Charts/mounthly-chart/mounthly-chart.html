<h1 class="fs-2 mb-5" style="color: var(--primary);">Gastos Mensais</h1>
<ngx-charts-bar-vertical style="display: flex; flex-direction: column;"
    [results]="results"
    [view]="view"
    [legend]="legend"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [showXAxisLabel]="showXAxisLabel"
    [showYAxisLabel]="showYAxisLabel"
    [animations]="animations"
    [legendTitle]="titleLegend"
    [autofocus]="autoFocus"
    [showGridLines]="showGrideLines"
    [roundDomains]="roundDomais"
></ngx-charts-bar-vertical>
