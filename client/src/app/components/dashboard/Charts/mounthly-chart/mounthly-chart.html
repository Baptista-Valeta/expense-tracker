<h1 class="fs-2 mb-5" style="color: var(--primary);">Gastos Mensais</h1>

@if (results()) {
    <ngx-charts-line-chart style="display: flex; flex-direction: column;"
        [results]="results()"
        [view]="view"
        [legend]="legend"
        [xAxis]="showXAxis"
        [yAxis]="showYAxis"
        [showXAxisLabel]="showXAxisLabel"
        [showYAxisLabel]="showYAxisLabel"
        [animations]="animations"
        [showGridLines]="showGrideLines"
        [roundDomains]="roundDomais"
        [autoScale]="autoScale"
    ></ngx-charts-line-chart>
}@else {
    <div>
        <h3 class="text-center">Sem dados para o gráfico</h3>
    </div>
}
