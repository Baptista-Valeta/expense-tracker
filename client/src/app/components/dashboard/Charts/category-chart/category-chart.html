<h1 class="fs-2 mb-5" style="color: var(--text-title)">Gastos por Categoria</h1>

@if(results()) {
    <div style="color: white">
        <ngx-charts-pie-chart
        [results]="results()"
        [view]="view"
        [labels]="labels"
        [animations]="animations"
        [legend]="legend"
        [legendTitle]="title"
        [doughnut]="doughnuts"
        ></ngx-charts-pie-chart>
    </div>
}
