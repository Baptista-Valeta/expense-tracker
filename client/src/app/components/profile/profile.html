<div class="profile" style="padding: var(--dashboard-padding); height: 100%;">
    <div class="h-75 d-flex rounded-top-4 border overflow-hidden">
        <form [formGroup]="editProfile" (ngSubmit)="openForm(editProfile.get('name')?.value, editProfile.get('email')?.value)" class="dados h-100 w-25 p-3 fs-6">
            <div class="mb-5 h-25 w-50 rounded-5 m-auto d-flex justify-content-center" style="align-items: center;">
                <span class="text-center" style="transform: scale(6);"><i class="bi bi-person-circle text-secondary" style="transform: scale(3);"></i></span>
            </div>

            <div class="justify-content-center text-center">
                <input type="text" class="form-control border mb-3" formControlName="name">
                <input type="text" class="form-control border" formControlName="email">                 
            </div>

            <div class="pt-5 text-center">
                <button  class="btn border w-75 text-light" style="background-color: var(--sidebar);">Editar Perfil</button>
            </div>
        </form>

        <div class="h-100 w-75 p-4" style="border-left: 1px solid var(--border);">
            <h3 class="mb-5">PREFERÊNCIAS</h3>
            <p>Aparência</p>

            <div class="border mb-3">
                <p>Claro</p>
                <p>Activo</p>
            </div>
            <div class="border">
                <p>Escuro</p>
                <p>Desativado</p>
            </div>
        </div>
    </div>

    <div class="border border-top-0 rounded-bottom-4 h-25 p-4">
        <h3>CONTA</h3>

        <div>
            <p>Alterar palavra-passe</p>
            <p>********</p>
        </div>
    </div>
</div>

<div class="border d-none d-flex justify-content-center w-100 h-100" style="position: absolute; top: 0; left: 0; align-items: center;">
    <form class="border w-25 h-50 bg-light">
        <h4>Editar Perfil</h4>
        <div class="">
            a
        </div>
    </form>
</div>
